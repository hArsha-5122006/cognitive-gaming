services:
  - type: web
    name: cognitive-gaming-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cognitive-gaming-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
databases:
  - name: cognitive-gaming-db
    plan: free
